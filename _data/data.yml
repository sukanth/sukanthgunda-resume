#
# Sukanth Gunda — resume content.
# Rendered at https://resume.sukanthgunda.com
#
# YAML is whitespace-sensitive — preserve indentation.
#
# Conventions worth keeping when you edit:
#   * Section titles use the standard headings applicant tracking systems
#     recognise ("Professional Summary", "Work Experience", "Technical
#     Skills", "Education", "Projects"). Renaming them to something creative
#     makes parsers drop or misfile the section.
#   * Dates use one consistent format throughout. If you add months, use
#     "Mon YYYY" ("Jan 2024 – Present") everywhere — never mix formats.
#   * Skills are plain comma-separated text, not percentage bars: a parser
#     reads text, and cannot read a CSS bar width.
#   * Job titles are spelled out in full ("Senior Software Engineer", never
#     "Sr. SWE") so keyword matching works.
#   * Bullets are one or two lines, three to six per role, each opening with a
#     strong verb and naming something concrete.
#   * Only list a skill you would be happy to be interviewed on.
#

sidebar:
    position: right # position of the sidebar : left or right
    about: False # set to False or comment line if you want to remove the "how to use?" in the sidebar
    education: True # set to False if you want education in main section instead of in sidebar
    certifications: True # sidebar on the web page; the PDF always keeps them in the linear flow
    skills: True # same: sidebar on the web, main column in the PDF

