career-profile:
    title: Professional Summary
    # Keep this tight. It is the only paragraph most recruiters read in full.
    summary: |
      Senior Software Engineer at Microsoft who turns **agentic AI** from
      demonstrations into production systems engineering organizations depend on
      daily — platforms where specialized agents, policy-as-code, and evaluation
      harnesses move quality, security, and compliance into the **developer inner
      loop**. **12+ years** in backend and distributed systems underneath it: the
      judgment to know what to automate, what stays human-reviewed, and how to
      operate it once it ships.

    # Used verbatim for meta description and JSON-LD so machine-readable copy
    # never drifts from, or truncates, the summary above.
    short_summary: >
      Senior Software Engineer at Microsoft leading agentic AI platforms — specialized
      agents, policy-as-code, and evaluation harnesses that move quality, security, and
      compliance into the developer inner loop — on 12+ years of backend and
      distributed systems.

skills:
    title: Technical Skills
    # Deliberately short. Keyword coverage already lives in the summary and the
    # experience bullets; this block exists so an ATS keyword scan finds the
    # terms in one place, not to pad the resume. Four groups, one line each.
    #
    # Everything here should be something you can be interviewed on. Kubernetes
    # and OCI are listed on the strength of the certifications below. Still left
    # out for want of evidence — add back any you have production experience
    # with: Apache Kafka, Spring Batch, OpenTelemetry, OAuth 2.0 / OpenID
    # Connect, secrets management, Azure OpenAI, event-driven architecture.
    groups:
      - category: AI &amp; Agentic Systems
        items: Agentic AI, Multi-agent orchestration, Microsoft Agent Framework, Azure OpenAI, Large Language Models (LLMs), Model Context Protocol (MCP), Retrieval-Augmented Generation (RAG), Embeddings &amp; vector search, Evals, Responsible AI

      - category: Languages &amp; Backend
        items: Java, Python, .NET, TypeScript, SQL, Spring Boot, Microservices, Event-driven architecture, System design

      - category: Cloud, Data &amp; Security
        items: Microsoft Azure, Azure Functions, Cosmos DB, Service Bus, Kusto, AWS, Oracle Cloud Infrastructure (OCI), Kubernetes, Docker, CI/CD, SLOs &amp; observability, Policy-as-code, SARIF, Secure SDLC

experiences:
    title: Work Experience
    info:
      - role: Senior Software Engineer
        time: Jul 2024 – Present
        company: Microsoft, Atlanta, GA
        roles:
          - title: Senior Software Engineer (Lead), Level 64
            time: Aug 2026 – Present
          - title: Senior Software Engineer, Level 63
            time: Jul 2024 – Aug 2026
        details: |
            - **Own the problem space** for developer-first reliability and compliance
              platforms — setting technical direction, resolving ambiguity, and taking
              systems from strategy to production-hardened service.
            - **Architect multi-agent evaluation systems** on **Azure OpenAI** and the
              open-source **Microsoft Agent Framework** — dispatcher, specialized
              analysis agents, aggregator, and reviewer — returning inline
              pull-request feedback, blocking checks, and auto-apply fixes.
            - Shift quality, security, and **Responsible AI** governance **left into
              the developer inner loop** as policy-as-code gates enforced at pull
              request time.
            - Build event-driven services on **.NET and Python Azure Functions, Cosmos
              DB, Service Bus, and Kusto**, with **SARIF** as a common contract and
              pluggable analyzers.
            - **Drive alignment across engineering, security, and identity partner
              teams**, and extend reach into the IDE through **VS Code** and **Model
              Context Protocol (MCP)** integrations.
            - Operate what I build — **SLOs, telemetry, on-call ownership** — and grow
              engineers through mentoring and architecture reviews.

        extended: |
            - Co-authored the strategy for a **developer-first reliability control
              plane** that turns reliability, security, compliance, and operational
              readiness into policy-as-code gates and agentic workflows spanning
              build, validation, release, and operations.
            - Designed analyzers that evaluate customer-facing **error message
              quality** at pull-request time — clarity, actionability, Azure Resource
              Manager compliance, and PII safety — with a reviewer agent that strips
              duplicates and false positives before anything reaches the author.
            - Built quality analyzers for **operational documentation** that score
              completeness, content quality, and readability, track quality trends
              over time, and emit **SARIF** so results are machine-readable and
              chartable.
            - Extended platform reach into the IDE and authoring tools through
              **plugin integrations**, so engineers get feedback where they already
              work instead of in a separate portal.
            - Favour **specialized agents plus deterministic orchestration** over a
              single generic model call, so results are reproducible, explainable,
              and safe to act on automatically.
            - Instrument everything with **Azure Data Explorer / Kusto** telemetry and
              use it to prove impact and target the next increment.

      - role: Senior Software Engineer
        time: Nov 2018 – Jul 2024
        company: Oracle, San Antonio, TX
        details: |
            - **Led feature releases** for **Electronic Health Record (EHR)**
              applications, designing **Java / Spring Boot** services that interface
              external systems and government health registries.
            - Built interoperability middleware bridging external system interfaces
              and the EHR for healthcare data exchange.
            - **Owned** migration of Java applications and workloads from **AWS** to
              **Oracle Cloud Infrastructure**.
            - Mentored new associates as a volunteer **Cerner Developer Center**
              mentor since 2018 — code reviews and architecture guidance.

        extended: |
            - Worked across **Electronic Health Record** interfaces and government
              health registries, building middleware that let external and foreign
              systems exchange clinical data with the EHR.
            - Partnered with SRE and platform teams on **observability, alert tuning,
              and incident runbooks**, reducing on-call toil.
            - Established secure-coding, error-handling, and **backward-compatible API
              evolution** patterns through RFCs, design reviews, and
              production-readiness reviews.
            - Strengthened **CI/CD and automated regression testing** so defects
              surfaced before release rather than in production.
            - Coached engineers through the Cerner Developer Center on code review,
              architecture, and engineering fundamentals.

      - role: Lead Software Engineer
        time: Feb 2013 – Nov 2018
        company: Capgemini, Atlanta, GA and Chennai, India
        # Titles and dates below are exactly as they appear on the LinkedIn
        # profile export, so the resume and that profile agree.
        #
        # If Capgemini's internal grade names are what you would rather show
        # (Consultant / Senior Consultant / Programmer Developer Lead), replace
        # the `title:` values here — keep the dates, or correct them to match
        # the grade changes. Do not mix the two naming schemes.
        roles:
          - title: Lead Software Engineer
            time: Aug 2018 – Nov 2018
          - title: Consultant
            time: Aug 2017 – Aug 2018
          - title: Senior Software Engineer
            time: Feb 2014 – Jul 2016
          - title: Software Engineer
            time: Feb 2013 – Feb 2014
        details: |
            - Led a delivery team and owned enterprise application modules from
              requirements and technical design through production handoff.
            - Built **Java / J2EE** web applications and batch jobs across the full
              cycle — analysis, design, build, deployment, and testing.
        extended: |
            - Coached engineers on coding standards, debugging, and release
              discipline; unblocked the team on complex technical issues.
            - Worked directly with client architects and product owners on
              requirements and technical design for enterprise delivery.
            - Handled performance tuning and production defect triage on live Java
              batch workloads.

