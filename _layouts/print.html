---
#Add "layout: compress" here to compress the html code
---
<!DOCTYPE html>
<html lang="en">
{% include head.html %}

<body class="print-layout">
  <div class="wrapper">
    {% include print-header.html %}

    <main class="main-wrapper" id="resume-content">
      {{ content }}
    </main>
  </div>

  {% include scripts.html %}

  <script>
    // Opened from the "Download PDF" button: go straight to the browser's own
    // print dialog. "Save as PDF" there produces real, selectable text — which
    // is what applicant tracking systems need. Rasterised canvas PDFs are
    // unreadable to them.
    (function () {
      if (new URLSearchParams(window.location.search).has('print')) {
        window.addEventListener('load', function () {
          window.setTimeout(function () { window.print(); }, 350);
        });
      }
    })();
  </script>
</body>

</html>
