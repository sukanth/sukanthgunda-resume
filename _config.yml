# All resume content lives in _data/data.yml — edit that file, not this one.

# Site Settings
title: Sukanth Gunda · Senior Software Engineer
url: "https://resume.sukanthgunda.com"

# Custom domain is configured via CNAME, so no baseurl is needed.
#baseurl: '/online-cv'

# Fallback only. Pages use career-profile.short_summary from _data/data.yml so
# the meta description and JSON-LD cannot drift from the resume itself.
description: >-
  Sukanth Gunda — Senior Software Engineer at Microsoft building agentic AI
  developer tooling: GitHub Copilot skills, LLM agents, and Model Context
  Protocol (MCP) servers.

# Style is applied at build time. Options: blue turquoise green berry orange ceramic teal oceanstale
theme_skin: oceanstale
chrome_mobile_color: "#183948" # hex colour for the Chrome mobile search bar

# Analytics
# The previous value was a Universal Analytics property (UA-...). Google shut
# Universal Analytics down in July 2023, so that tag collected nothing and only
# added a blocking third-party script. Put a GA4 measurement ID ("G-XXXXXXXXXX")
# here to re-enable analytics, or leave it blank to ship no tracking at all.
analytics:

# Sass/SCSS
sass:
  sass_dir: _sass
  style: compressed

# Build settings
compress-site: yes
encoding: "utf-8"

compress_html: # http://jch.penibelst.de/
  clippings: all
  ignore:
    envs: development

# Files that should never end up in the published site.
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - LICENSE.md
  - docker-compose.yml
  - vendor
  - node_modules
  - package.json
  - package-lock.json
  - .idea
  - .github
  - .playwright-mcp
  - "*.png.bak"

# Development Settings
port: 4000
host: 0.0.0.0
safe: false
